appId: com.maglobal.evenlease
name: 01_onboarding
---
# Fresh install (run-ios.sh reinstalls per lane): first open = SQLite created + migrated, then S-01 (TC-127..130).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(New rental|Pick tenants the same way.*)"
    timeout: 90000
# B-40 (runs 1-3: a fresh install opened "New rental" instead of S-01). Fixed in integ/round1: the real path must
# reach S-01; if "New rental" still shows, keep the evidence and let the next step fail (= B-40 not fixed on iOS).
# (Workaround if ever needed again: openLink "evenlease://onboarding", then tap "Open" on iOS's 'Open in "Evenlease"?'.)
- runFlow:
    when:
      visible: "New rental"
    commands:
      - takeScreenshot: ${LANE}_01z_B40_fresh_install_new_rental
- extendedWaitUntil:
    visible: "Pick tenants the same way.*"
    timeout: 10000
- takeScreenshot: ${LANE}_01a_page1
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Verify, don.t guess.*"
    timeout: 10000
- takeScreenshot: ${LANE}_01b_page2
- tapOn: "Next"
- extendedWaitUntil:
    visible: "A checklist, not legal advice.*"
    timeout: 10000
# Gate: nothing goes on until the box is ticked.
- scrollUntilVisible:
    element:
      text: "Explore with a sample rental"
    timeout: 10000
- tapOn: "Explore with a sample rental"
- takeScreenshot: ${LANE}_01c_page3_not_ticked
- assertVisible: "A checklist, not legal advice.*"
# The box sits under the fixed footer until the page is scrolled (SE, and AX-XL text): bring it to the middle first
# (run 45799132934: the tap hit the footer on SE, element not found on Pro Max AX-XL).
- scrollUntilVisible:
    element:
      text: "I understand Evenlease is not legal advice"
    centerElement: true
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "I understand Evenlease is not legal advice"
- takeScreenshot: ${LANE}_01d_ticked
- tapOn: "Explore with a sample rental"
- extendedWaitUntil:
    visible: ".*1428 Maple.*"
    timeout: 20000
- takeScreenshot: ${LANE}_01e_rentals
