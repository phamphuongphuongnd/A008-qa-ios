appId: com.maglobal.evenlease
name: 02_home_hub
---
# Restart: onboarding must not come back (the gate is kept in SQLite). TC-131 / TC-132.
- runFlow: common/home.yaml
- assertNotVisible: "Pick tenants the same way.*"
- takeScreenshot: ${LANE}_02a_rentals_after_restart
- tapOn: ".*1428 Maple.*"
- extendedWaitUntil:
    visible: "Compare applicants.*"
    timeout: 15000
- takeScreenshot: ${LANE}_02b_hub
- scrollUntilVisible:
    element:
      text: ".*Dana.*"
    timeout: 15000
- takeScreenshot: ${LANE}_02c_hub_list
# S-03 at this lane's text size (B-81 retest: "State" picker must not break mid-word at AX-XL). Nothing typed → Back.
- runFlow: common/home.yaml
- tapOn: "New rental"
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 15000
- takeScreenshot: ${LANE}_02d_s03_new_rental
- tapOn: "Back"
