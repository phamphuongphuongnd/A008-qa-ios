<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ev {{theme}}" style="width: 390px; height: 844px">
  <header class="top back">
    <span class="ib" aria-hidden="true"><i class="i i-left"></i></span>
    <div class="t"><p class="cap">Step 2 of 2 · 1428 Maple St</p><h1 class="h2">Criteria</h1></div>
  </header>
  <main class="body"><div class="card" style="height: 200px"></div><div class="card" style="height: 160px"></div></main>
  <div class="scrim" aria-hidden="true"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
    <span class="grab" aria-hidden="true"></span>
    <h2 class="h2" id="t">Add your own criterion</h2>
    <div class="fld">
      <label for="ct">Yes / no criterion</label>
      <input class="in err" id="ct" value="No families with young children" aria-invalid="true" aria-describedby="ce">
      <p class="hint">Up to 80 characters · 30/80</p>
    </div>
    <div class="ban dn" id="ce" role="alert">
      <i class="i i-alert" aria-hidden="true"></i>
      <div class="col" style="gap: 4px">
        <p style="font-weight: 650">This can't be a criterion</p>
        <p class="sm">This looks like it could screen on a protected characteristic or source of income. Fair housing laws prohibit that.</p>
      </div>
    </div>
    <div class="col" style="gap: 6px">
      <span class="lbl">Who answers it?</span>
      <div class="seg"><button class="on">Applicant answers</button><button>Landlord checks</button></div>
    </div>
    <div class="row" style="gap: 10px; margin-top: 4px">
      <button class="btn sec grow">Cancel</button>
      <button class="btn grow" disabled>Add criterion</button>
    </div>
    <a class="sm" href="S25-Guide.dc.html" style="color: var(--ac); font-weight: 600; text-align: center">What makes a criterion fair?</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

}
</script>
