<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New rental</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/8b7954830edb5315f9432043d2522dd7">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ev {{theme}}" style="width: 390px; height: 844px">
  <header class="top back">
    <a class="ib" href="Main.dc.html" aria-label="Back"><i class="i i-left" aria-hidden="true"></i></a>
    <div class="t"><p class="cap">Step 1 of 2</p><h1 class="h2">New rental</h1></div>
  </header>
  <main class="body" style="gap: 14px">
    <div class="fld"><label for="addr">Street address</label><input class="in" id="addr" value="1428 Maple St"></div>
    <div class="row" style="gap: 10px; align-items: flex-start">
      <div class="fld" style="width: 110px"><label for="unit">Unit</label><input class="in" id="unit" value="B"></div>
      <div class="fld grow"><label for="city">City</label><input class="in" id="city" value="Columbus"></div>
    </div>
    <div class="row" style="gap: 10px; align-items: flex-start">
      <div class="fld grow"><label for="st">State</label><div class="in" id="st" style="justify-content: space-between">OH<i class="i s i-right" aria-hidden="true" style="transform: rotate(90deg); color: var(--tx2)"></i></div></div>
      <div class="fld" style="width: 130px"><label for="zip">ZIP</label><input class="in num" id="zip" value="43215"></div>
    </div>
    <div class="row" style="gap: 10px; align-items: flex-start">
      <div class="fld grow"><label for="rent">Monthly rent</label><input class="in num" id="rent" value="$1,650"></div>
      <div class="fld" style="width: 96px"><label for="bd">Bedrooms</label><input class="in num" id="bd" value="2"></div>
      <div class="fld" style="width: 96px"><label for="ba">Baths</label><input class="in num" id="ba" value="1"></div>
    </div>
    <div class="row" style="gap: 10px; align-items: flex-start">
      <div class="fld grow"><label for="av">Available from</label><input class="in" id="av" value="Jan 1, 2027"></div>
      <div class="fld grow"><label for="fee">Application fee</label><input class="in num" id="fee" value="$0"></div>
    </div>
    <div class="col" style="gap: 8px; margin-top: 4px">
      <span class="lbl">Review mode</span>
      <div class="seg" role="radiogroup" aria-label="Review mode">
        <button class="{{cmpCls}}" role="radio" aria-checked="{{isCmp}}" onClick="{{setCmp}}">Compare applicants</button>
        <button class="{{fcCls}}" role="radio" aria-checked="{{isFc}}" onClick="{{setFc}}">First-come order</button>
      </div>
      <sc-if value="{{isCmp}}" hint-placeholder-val="{{ true }}"><p class="sub">Review everyone, then choose. Same criteria for all.</p></sc-if>
      <sc-if value="{{isFc}}" hint-placeholder-val="{{ false }}"><p class="sub">Review in the order received and offer to the first who qualifies. Required in Seattle; a good habit anywhere.</p></sc-if>
    </div>
    <p class="hint">Some states cap or ban application fees.</p>
  </main>
  <div style="padding: 12px 20px 34px; border-top: 1px solid var(--bd); background: var(--bg)">
    <a class="btn block" href="S04-Criteria.dc.html">Next: criteria<i class="i i-right" aria-hidden="true"></i></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'cmp' }; }
  renderVals() {
    const c = this.state.mode === 'cmp';
    return {
      theme: this.props.dark ? 'dark' : '',
      isCmp: c, isFc: !c, cmpCls: c ? 'on' : '', fcCls: c ? '' : 'on',
      setCmp: () => this.setState({ mode: 'cmp' }), setFc: () => this.setState({ mode: 'fc' })
    };
  }
}
</script>
</body>
</html>
