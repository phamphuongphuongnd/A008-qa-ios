<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marcus Webb — applicant</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/8b7954830edb5315f9432043d2522dd7">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ev {{theme}}" style="width: 390px; height: 1000px">
  <header class="top back">
    <a class="ib" href="S06-RentalHub.dc.html" aria-label="Back to rental"><i class="i i-left" aria-hidden="true"></i></a>
    <div class="t"><h1 class="h2">Marcus Webb</h1><p class="sub num">Received Dec 3, 11:05 AM · 3 people</p></div>
    <button class="ib" aria-label="More actions"><i class="i i-more" aria-hidden="true"></i></button>
  </header>
  <main class="body">
    <div class="card" style="flex-direction: row; align-items: center; gap: 12px">
      <i class="i l i-circle" aria-hidden="true" style="color: var(--ms)"></i>
      <div class="grow"><p style="font-weight: 700">1 item missing</p><p class="sm" style="color: var(--tx2)">Not a score. Same criteria for every applicant.</p></div>
    </div>
    <div class="card" style="background: var(--wns); border-color: transparent; gap: 4px">
      <p class="cap" style="color: var(--wn)">Issues · 4</p>
      <sc-for list="{{issues}}" as="x" hint-placeholder-count="4">
        <div class="row" style="align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(154,74,11,.18)">
          <i class="i s {{x.icon}}" aria-hidden="true" style="color: {{x.col}}; margin-top: 2px"></i>
          <div class="grow col" style="gap: 2px"><p class="sm" style="font-weight: 650">{{x.title}}</p><p class="sm" style="color: var(--tx2)">{{x.detail}}</p></div>
          <a class="btn sm" href="{{x.href}}" style="background: var(--sf); color: var(--ac)">{{x.act}}</a>
        </div>
      </sc-for>
    </div>
    <div class="card" style="padding: 4px 16px; gap: 0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <div class="li" style="align-items: flex-start; gap: 10px">
          <div class="grow col" style="gap: 3px"><p style="font-weight: 600; font-size: 14px">{{r.name}}</p><p class="sm sub num">{{r.reason}}</p></div>
          <div class="col" style="align-items: flex-end; gap: 4px">
            <span class="b {{r.bcls}}"><i class="i s {{r.icon}}" aria-hidden="true"></i>{{r.out}}</span>
            <span class="e {{r.ecls}}"><i class="i s {{r.eicon}}" aria-hidden="true"></i>{{r.ev}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
  <div style="padding: 12px 20px 34px; border-top: 1px solid var(--bd); background: var(--bg)">
    <a class="btn block" href="S15-Decision.dc.html">Make a decision</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const W = 'var(--wn)', M = 'var(--ms)';
    const issues = [
      { icon: 'i-neq', col: W, title: 'Dates don’t match', detail: 'Applied: since Mar 2022 · Landlord: since Jan 2023', act: 'Review', href: 'S11-LandlordRef.dc.html' },
      { icon: 'i-neq', col: W, title: 'Rent doesn’t match (+29%)', detail: 'Applied: $1,200 · Landlord: $1,550', act: 'Review', href: 'S11-LandlordRef.dc.html' },
      { icon: 'i-alert', col: W, title: 'Landlord wouldn’t say if they’d rent again', detail: 'Needs review — your call', act: 'Notes', href: 'S11-LandlordRef.dc.html' },
      { icon: 'i-circle', col: M, title: 'Unpaid landlord balance unknown', detail: 'No screening report yet', act: 'Add report', href: 'S13-Report.dc.html' }
    ];
    const met = { out: 'Met', bcls: 'met', icon: 'i-check' };
    const rows = [
      { name: 'Income 3.0× rent', reason: '$6,100/mo on pay stubs is 3.70× rent', ...met, ev: 'Verified', ecls: 'ver', eicon: 'i-shield' },
      { name: '12 months rental history', reason: '56 months stated · landlord says 47', ...met, ev: 'Mismatch', ecls: 'mis', eicon: 'i-neq' },
      { name: 'No eviction judgment (5 yr)', reason: 'Applicant answered No', ...met, ev: 'Claimed', ecls: '', eicon: 'i-bubble' },
      { name: 'Previous landlord would rent again', reason: 'Landlord wouldn’t say', out: 'Needs review', bcls: 'rev', icon: 'i-alert', ev: 'Verified', ecls: 'ver', eicon: 'i-shield' },
      { name: 'No unpaid landlord balance', reason: 'No source yet', out: 'Missing', bcls: 'miss', icon: 'i-circle', ev: '—', ecls: '', eicon: 'i-bubble' },
      { name: 'Required documents', reason: 'Photo ID, 2 pay stubs — checked', ...met, ev: 'Verified', ecls: 'ver', eicon: 'i-shield' },
      { name: 'Occupancy ≤ 4', reason: '3 people', ...met, ev: 'Claimed', ecls: '', eicon: 'i-bubble' },
      { name: 'Pets: cats and dogs, max 2', reason: 'No pets', ...met, ev: 'Claimed', ecls: '', eicon: 'i-bubble' }
    ];
    return { theme: this.props.dark ? 'dark' : '', issues, rows };
  }
}
</script>
</body>
</html>
