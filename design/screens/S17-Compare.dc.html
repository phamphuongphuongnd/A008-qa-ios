<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare applicants</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/8b7954830edb5315f9432043d2522dd7">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ev {{theme}}" style="width: 390px; height: 844px">
  <header class="top back">
    <a class="ib" href="S06-RentalHub.dc.html" aria-label="Back"><i class="i i-left" aria-hidden="true"></i></a>
    <div class="t"><p class="cap">1428 Maple St, Unit B</p><h1 class="h2">Compare</h1></div>
  </header>
  <main class="body" style="gap: 10px; padding-left: 0; padding-right: 0">
    <div class="ban nt" style="margin: 0 20px"><i class="i i-info" aria-hidden="true" style="color: var(--tx2)"></i><p class="sm" style="color: var(--tx2)">Not a ranking. Columns are in the order applications were received.</p></div>
    <div class="row" style="padding: 0 20px"><span class="grow sm sub">Hide denied / withdrawn</span><button class="sw" role="switch" aria-checked="false" aria-label="Hide denied or withdrawn"></button></div>
    <div style="overflow-x: auto; overflow-y: hidden; padding-left: 20px">
      <table style="border-collapse: separate; border-spacing: 0; font-size: 13px">
        <thead>
          <tr>
            <th scope="col" style="position: sticky; left: 0; background: var(--bg); min-width: 132px; text-align: left; padding: 8px 8px 8px 0" class="cap">Criteria</th>
            <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
              <th scope="col" style="min-width: 96px; padding: 8px 6px; text-align: left; vertical-align: bottom"><a href="{{p.href}}" style="color: var(--tx); text-decoration: none"><span style="font-weight: 650; display: block">{{p.name}}</span><span class="hint num">{{p.when}}</span></a></th>
            </sc-for>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
            <tr>
              <th scope="row" style="position: sticky; left: 0; background: var(--bg); text-align: left; font-weight: 600; padding: 10px 8px 10px 0; border-top: 1px solid var(--bd)">{{r.name}}</th>
              <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
                <td style="padding: 10px 6px; border-top: 1px solid var(--bd)">
                  <div class="col" style="gap: 3px">
                    <span class="b {{c.b}}" style="height: 22px; font-size: 12px"><i class="i s {{c.i}}" aria-hidden="true"></i>{{c.t}}</span>
                    <span class="e {{c.ec}}"><i class="i s {{c.ei}}" aria-hidden="true"></i>{{c.e}}</span>
                  </div>
                </td>
              </sc-for>
            </tr>
          </sc-for>
          <tr>
            <th scope="row" style="position: sticky; left: 0; background: var(--bg); text-align: left; padding: 10px 8px 10px 0; border-top: 2px solid var(--bd)">Issues</th>
            <sc-for list="{{people}}" as="p" hint-placeholder-count="4"><td class="num" style="padding: 10px 6px; border-top: 2px solid var(--bd); font-weight: 700; color: {{p.icol}}">{{p.issues}}</td></sc-for>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = {
      MV: { b: 'met', i: 'i-check', t: 'Met', ec: 'ver', ei: 'i-shield', e: 'Verified' },
      MC: { b: 'met', i: 'i-check', t: 'Met', ec: '', ei: 'i-bubble', e: 'Claimed' },
      MX: { b: 'met', i: 'i-check', t: 'Met', ec: 'mis', ei: 'i-neq', e: 'Mismatch' },
      NV: { b: 'not', i: 'i-x', t: 'Not met', ec: 'ver', ei: 'i-shield', e: 'Verified' },
      NC: { b: 'not', i: 'i-x', t: 'Not met', ec: '', ei: 'i-bubble', e: 'Claimed' },
      RV: { b: 'rev', i: 'i-alert', t: 'Review', ec: 'ver', ei: 'i-shield', e: 'Verified' },
      MS: { b: 'miss', i: 'i-circle', t: 'Missing', ec: '', ei: 'i-clock', e: 'No source' }
    };
    const grid = [
      ['Income 3.0×', 'MV', 'NC', 'MV', 'MV'],
      ['Rental history 12 mo', 'MV', 'MC', 'MX', 'MV'],
      ['No eviction judgment', 'MV', 'MV', 'MC', 'RV'],
      ['Landlord would rent again', 'MV', 'MS', 'RV', 'MV'],
      ['No landlord balance', 'MV', 'NV', 'MS', 'MV'],
      ['Documents', 'MV', 'MS', 'MV', 'MV'],
      ['Occupancy ≤ 4', 'MC', 'MC', 'MC', 'MC'],
      ['Pets', 'MC', 'MC', 'MC', 'MC']
    ];
    const rows = grid.map((g) => ({ name: g[0], cells: g.slice(1).map((k) => C[k]) }));
    const people = [
      { name: 'Jordan E.', when: 'Dec 2 · 9:14', issues: '0', icol: 'var(--ac)', href: 'S09-Ready.dc.html' },
      { name: 'Priya R.', when: 'Dec 2 · 2:40', issues: '4', icol: 'var(--wn)', href: 'S15-Decision.dc.html' },
      { name: 'Marcus W.', when: 'Dec 3 · 11:05', issues: '4', icol: 'var(--wn)', href: 'S09-Issues.dc.html' },
      { name: 'Dana O.', when: 'Dec 4 · 8:20', issues: '1', icol: 'var(--wn)', href: 'S09-Ready.dc.html' }
    ];
    return { theme: this.props.dark ? 'dark' : '', rows, people };
  }
}
</script>
</body>
</html>
