<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jordan Ellis — applicant</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/8b7954830edb5315f9432043d2522dd7">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ev {{theme}}" style="width: 390px; height: 1000px">
  <header class="top back">
    <a class="ib" href="S06-RentalHub.dc.html" aria-label="Back to rental"><i class="i i-left" aria-hidden="true"></i></a>
    <div class="t"><h1 class="h2">Jordan Ellis</h1><p class="sub num">Received Dec 2, 9:14 AM · 2 people · 1 dog</p></div>
    <button class="ib" aria-label="More actions"><i class="i i-more" aria-hidden="true"></i></button>
  </header>
  <main class="body">
    <div class="card" style="background: var(--acs); border-color: transparent; flex-direction: row; align-items: center; gap: 12px">
      <i class="i l i-check" aria-hidden="true" style="color: var(--ac)"></i>
      <div class="grow"><p style="font-weight: 700; color: var(--ac)">Ready to decide</p><p class="sm" style="color: var(--tx2)">Not a score. Same criteria for every applicant.</p></div>
    </div>
    <div class="card" style="padding: 4px 16px; gap: 0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
        <div class="li" style="align-items: flex-start; gap: 10px">
          <div class="grow col" style="gap: 3px">
            <p style="font-weight: 600; font-size: 14px">{{r.name}}</p>
            <p class="sm sub num">{{r.reason}}</p>
          </div>
          <div class="col" style="align-items: flex-end; gap: 4px">
            <span class="b {{r.bcls}}"><i class="i s {{r.icon}}" aria-hidden="true"></i>{{r.out}}</span>
            <span class="e {{r.ecls}}"><i class="i s {{r.eicon}}" aria-hidden="true"></i>{{r.ev}}</span>
          </div>
        </div>
      </sc-for>
    </div>
    <div class="card" style="padding: 4px 16px; gap: 0">
      <sc-for list="{{secs}}" as="s" hint-placeholder-count="6">
        <a class="li" href="{{s.href}}"><i class="i {{s.icon}}" aria-hidden="true" style="color: var(--ac)"></i><span class="grow" style="font-weight: 600">{{s.name}}</span><span class="sub sm">{{s.meta}}</span><i class="i s i-right" aria-hidden="true" style="color: var(--tx2)"></i></a>
      </sc-for>
    </div>
  </main>
  <div style="padding: 12px 20px 34px; border-top: 1px solid var(--bd); background: var(--bg)">
    <a class="btn block" href="S15-Decision.dc.html">Make a decision</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const met = { out: 'Met', bcls: 'met', icon: 'i-check' };
    const ver = { ev: 'Verified', ecls: 'ver', eicon: 'i-shield' };
    const cl = { ev: 'Claimed', ecls: '', eicon: 'i-bubble' };
    const rows = [
      { name: 'Income 3.0× rent', reason: '$5,351.67/mo on pay stubs is 3.24× rent', ...met, ...ver },
      { name: '12 months rental history', reason: '26 months · landlord confirmed dates', ...met, ...ver },
      { name: 'No eviction judgment (5 yr)', reason: 'None found · MySmartMove, Dec 3', ...met, ...ver },
      { name: 'Previous landlord would rent again', reason: 'Yes · owner confirmed in county records', ...met, ...ver },
      { name: 'No unpaid landlord balance', reason: 'None · screening report', ...met, ...ver },
      { name: 'Required documents', reason: 'Photo ID, 2 pay stubs — checked', ...met, ...ver },
      { name: 'Occupancy ≤ 4', reason: '2 people', ...met, ...cl },
      { name: 'Pets: cats and dogs, max 2', reason: '1 dog', ...met, ...cl },
      { name: 'Criminal history review', reason: 'Not reviewed yet — after a conditional offer', out: 'After offer', bcls: 'na', icon: 'i-lock', ev: '—', ecls: '', eicon: 'i-clock' }
    ];
    const secs = [
      { name: 'Application', meta: 'Entered by you', icon: 'i-doc', href: 'S08-FormResidence.dc.html' },
      { name: 'Documents', meta: '3/3', icon: 'i-camera', href: 'S10-Documents.dc.html' },
      { name: 'References', meta: '2/2', icon: 'i-phone', href: 'S11-LandlordRef.dc.html' },
      { name: 'Screening report', meta: 'Dec 3', icon: 'i-shield', href: 'S13-Report.dc.html' },
      { name: 'Background (after offer)', meta: 'Locked', icon: 'i-lock', href: 'S14-Background.dc.html' }
    ];
    return { theme: this.props.dark ? 'dark' : '', rows, secs };
  }
}
</script>
</body>
</html>
